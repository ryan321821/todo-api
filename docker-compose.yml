services:
  # FastAPI 应用服务
  api:
    build: .  # 使用当前目录下的 Dockerfile 构建镜像
    container_name: todo-api
    ports:
      - "8000:8000"
    volumes:    # Bind Mount（绑定挂载）
      - ./app:/app/app  # 挂载 app 目录，./app是本地目录，/app/app是容器目录
      - ./static:/app/static
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload  # 开发模式（代码热重载）
    environment:
      DATABASE_URL: mysql+pymysql://todo:todo@db:3306/todo?charset=utf8mb4
      SECRET_KEY: change-me-in-production  # 生产环境请替换为随机安全密钥
    depends_on:
      db:
        condition: service_healthy  # 等待数据库健康检查通过后再启动

  # MySQL 8.0 数据库服务
  db:
    image: mysql:8.0
    container_name: todo-db
    command: --default-authentication-plugin=mysql_native_password  # 兼容认证插件
    environment:
      MYSQL_DATABASE: todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:    # Named Volume（命名卷）
      - mysql_data:/var/lib/mysql   # 数据库数据持久化，mysql_data 是存储空间变量名，不是本地文件路径
    healthcheck:
      # 检查 MySQL 是否已就绪
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:  # 数据库命名数据卷，保存 MySQL 数据，让数据库数据独立于 Container 的生命周期