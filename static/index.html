<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务备忘录 - Todo & Category API</title>
  <style>
    /* ==================== 全局基础样式 ==================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6f9;
      color: #2c3e50;
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 30px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 30px;
      color: #1f6feb;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      margin-top: 6px;
      color: #6c757d;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      padding: 22px;
      margin-bottom: 20px;
      border: 1px solid #eaeef2;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ==================== 表单与通用控件 ==================== */
    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
      background: #fafbfc;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: #1f6feb;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.12);
    }

    #task-title {
      flex: 3;
      min-width: 220px;
    }

    #task-category {
      flex: 1.5;
      min-width: 130px;
    }

    #task-priority {
      flex: 1.2;
      min-width: 110px;
    }

    textarea {
      margin-top: 12px;
      resize: vertical;
      min-height: 60px;
    }

    .btn-primary {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1f6feb;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover {
      background: #175fd0;
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    /* ==================== 分类管理面板 ==================== */
    .category-section {
      background: #fafbfc;
      border: 1px dashed #d0d7de;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .category-form-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .category-form-row input[type="text"] {
      flex: 2;
      min-width: 140px;
      padding: 8px 12px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #666;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
    }

    .btn-small {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #2ea44f;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-small:hover {
      background: #2c974b;
    }

    .category-tag-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      color: #fff;
      font-weight: 500;
    }

    .cat-badge-del {
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .cat-badge-del:hover {
      opacity: 1;
      font-weight: bold;
    }

    /* ==================== 分类胶囊筛选栏 ==================== */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 20px;
      background: #f0f2f5;
      border: 1px solid #e1e4e8;
      font-size: 13px;
      color: #555;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-chip:hover {
      background: #e4e7eb;
    }

    .filter-chip.active {
      background: #1f6feb;
      color: #fff;
      border-color: #1f6feb;
      font-weight: 500;
    }

    .color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ==================== 任务列表项 ==================== */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .stats {
      font-size: 13px;
      color: #888;
    }

    .btn-refresh {
      padding: 6px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      background: #fff;
      color: #555;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-refresh:hover {
      background: #f5f5f5;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 6px;
      border-bottom: 1px solid #f0f2f5;
      transition: background 0.15s;
    }

    .task-item:hover {
      background: #fafbfc;
      border-radius: 8px;
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-item input[type="checkbox"] {
      width: 19px;
      height: 19px;
      margin-top: 3px;
      cursor: pointer;
      flex-shrink: 0;
      accent-color: #1f6feb;
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
      color: #24292f;
    }

    .task-description {
      margin-top: 4px;
      font-size: 13px;
      color: #656d76;
      word-break: break-word;
    }

    .task-meta {
      margin-top: 8px;
      font-size: 12px;
      color: #8c959f;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* 任务完成样式 */
    .task-item.completed .task-title {
      text-decoration: line-through;
      color: #8c959f;
    }

    .task-item.completed .task-description {
      color: #afb8c1;
    }

    /* 优先级徽章 */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      color: #fff;
      font-weight: 500;
    }

    .badge.low { background: #52c41a; }
    .badge.medium { background: #fa8c16; }
    .badge.high { background: #f5222d; }

    .btn-delete {
      padding: 5px 12px;
      border: 1px solid #ffccc7;
      border-radius: 6px;
      background: #fff1f0;
      color: #cf1322;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .btn-delete:hover {
      background: #ffccc7;
    }

    .empty {
      text-align: center;
      color: #8c959f;
      padding: 36px 0;
      font-size: 14px;
    }

    /* ==================== 浮层提示信息 ==================== */
    .message {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
      max-width: 90%;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .message.success { background: #52c41a; }
    .message.error { background: #f5222d; }
    .message.info { background: #1f6feb; }

    footer {
      text-align: center;
      color: #8c959f;
      font-size: 12px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 任务备忘录 Pro</h1>
      <p>任务管理 + 自定义分类联动 · 基于 FastAPI 企业级多层分层架构</p>
    </header>

    <!-- 分类管理与快捷添加卡片 -->
    <section class="card">
      <div class="section-title">
        <span>🏷️ 分类管理</span>
        <span style="font-size: 12px; color: #888; font-weight: normal;">创建分类后可在任务中自由归类</span>
      </div>
      <div class="category-section">
        <form id="category-form" class="category-form-row">
          <input type="text" id="category-name" placeholder="新分类名称（如：工作/学习）" maxlength="50" required>
          <div class="color-picker-wrapper">
            <span>色彩：</span>
            <input type="color" id="category-color" value="#1890ff" title="选择分类颜色">
          </div>
          <button type="submit" class="btn-small">＋ 新增分类</button>
        </form>
        <div class="category-tag-list" id="category-tags">
          <!-- 动态加载已有分类标签 -->
        </div>
      </div>
    </section>

    <!-- 新增任务表单卡片 -->
    <section class="card">
      <div class="section-title">
        <span>✍️ 新建任务</span>
      </div>
      <form id="task-form">
        <div class="form-row">
          <input type="text" id="task-title" placeholder="任务标题（必填）" maxlength="100" required>
          <select id="task-category">
            <option value="">📂 选择所属分类（可选）</option>
            <!-- 动态填充分类选项 -->
          </select>
          <select id="task-priority">
            <option value="low">🟢 低优先级</option>
            <option value="medium" selected>🟠 中优先级</option>
            <option value="high">🔴 高优先级</option>
          </select>
        </div>
        <textarea id="task-description" placeholder="任务详细描述（选填，最多 500 字）" maxlength="500"></textarea>
        <button type="submit" class="btn-primary">＋ 添加任务</button>
      </form>
    </section>

    <!-- 任务列表卡片 -->
    <section class="card">
      <div class="list-header">
        <h2>任务列表</h2>
        <div>
          <span class="stats" id="stats"></span>
          <button class="btn-refresh" id="refresh-btn" type="button">🔄 刷新</button>
        </div>
      </div>

      <!-- 分类胶囊过滤栏 -->
      <div class="filter-bar" id="category-filters">
        <div class="filter-chip active" data-cat-id="">
          <span>全部任务</span>
        </div>
        <!-- 动态填充各分类筛选胶囊 -->
      </div>

      <!-- 任务项展示容器 -->
      <div id="task-list"></div>
      <div class="empty" id="empty-state">加载中...</div>
    </section>

    <footer>
      后端接口挂载于 <code>/api/v1/tasks</code> 与 <code>/api/v1/categories</code> · 兼容直接访问 <code>/tasks</code>
    </footer>
  </div>

  <!-- 提示消息浮层 -->
  <div class="message" id="message" hidden></div>

  <script>
    // ====================================================================
    // API 路径定义（统一使用企业级 /api/v1 版本前缀）
    // ====================================================================
    const API_CATEGORIES = "/api/v1/categories";

    // 全局状态
    let categoriesList = [];       // 缓存所有分类
    let selectedCategoryId = null; // 当前选中的筛选分类 ID (null 为全部)

    // DOM 元素引用
    const taskForm = document.getElementById("task-form");
    const taskTitleInput = document.getElementById("task-title");
    const taskCategorySelect = document.getElementById("task-category");
    const taskPrioritySelect = document.getElementById("task-priority");
    const taskDescInput = document.getElementById("task-description");
    const taskList = document.getElementById("task-list");
    const emptyState = document.getElementById("empty-state");
    const statsSpan = document.getElementById("stats");
    const refreshBtn = document.getElementById("refresh-btn");
    const messageBox = document.getElementById("message");

    const categoryForm = document.getElementById("category-form");
    const categoryNameInput = document.getElementById("category-name");
    const categoryColorInput = document.getElementById("category-color");
    const categoryTagsContainer = document.getElementById("category-tags");
    const categoryFiltersContainer = document.getElementById("category-filters");

    // ====================================================================
    // 消息提示函数
    // ====================================================================
    let messageTimer = null;
    function showMessage(text, type = "info") {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
      messageBox.hidden = false;
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => {
        messageBox.hidden = true;
      }, 3000);
    }

    // 格式化时间字符串
    function formatTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (isNaN(date.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    // 优先级展示转换
    function priorityInfo(priority) {
      const map = {
        low: ["低", "low"],
        medium: ["中", "medium"],
        high: ["高", "high"],
      };
      const item = map[priority] || ["中", "medium"];
      return { label: item[0], className: item[1] };
    }

    // ====================================================================
    // 1. 分类模块交互 (CRUD)
    // ====================================================================

    // 获取所有分类
    async function fetchCategories() {
      try {
        const response = await fetch(API_CATEGORIES);
        if (!response.ok) throw new Error("加载分类失败");
        const data = await response.json();
        categoriesList = data.categories || [];
        renderCategoryUI();
      } catch (err) {
        console.warn("分类加载失败:", err);
      }
    }

    // 渲染分类相关的所有 UI（管理区标签、表单下拉框、胶囊筛选栏）
    function renderCategoryUI() {
      // 1. 渲染管理区已有分类徽章
      categoryTagsContainer.innerHTML = "";
      if (categoriesList.length === 0) {
        categoryTagsContainer.innerHTML = `<span style="font-size:12px;color:#999;">暂无自定义分类，在上方输入名称即可创建</span>`;
      } else {
        categoriesList.forEach(cat => {
          const badge = document.createElement("span");
          badge.className = "cat-badge";
          badge.style.backgroundColor = cat.color || "#1890ff";
          badge.innerHTML = `
            <span>🏷️ ${cat.name}</span>
            <span class="cat-badge-del" title="删除该分类" onclick="deleteCategory(${cat.id})">&times;</span>
          `;
          categoryTagsContainer.appendChild(badge);
        });
      }

      // 2. 渲染新建任务表单的分类下拉选择框
      const currentVal = taskCategorySelect.value;
      taskCategorySelect.innerHTML = `<option value="">📂 选择所属分类（可选）</option>`;
      categoriesList.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat.id;
        opt.textContent = `🏷️ ${cat.name}`;
        taskCategorySelect.appendChild(opt);
      });
      taskCategorySelect.value = currentVal;

      // 3. 渲染分类胶囊筛选栏
      categoryFiltersContainer.innerHTML = "";
      
      // "全部" 胶囊
      const allChip = document.createElement("div");
      allChip.className = `filter-chip ${selectedCategoryId === null ? 'active' : ''}`;
      allChip.innerHTML = `<span>全部任务</span>`;
      allChip.onclick = () => selectCategoryFilter(null);
      categoryFiltersContainer.appendChild(allChip);

      // 各分类胶囊
      categoriesList.forEach(cat => {
        const chip = document.createElement("div");
        chip.className = `filter-chip ${selectedCategoryId === cat.id ? 'active' : ''}`;
        chip.innerHTML = `
          <span class="color-dot" style="background-color: ${cat.color || '#1890ff'}"></span>
          <span>${cat.name}</span>
        `;
        chip.onclick = () => selectCategoryFilter(cat.id);
        categoryFiltersContainer.appendChild(chip);
      });
    }

    // 切换分类筛选
    function selectCategoryFilter(catId) {
      selectedCategoryId = catId;
      renderCategoryUI();
      fetchTasks();
    }

    // 新增分类
    async function addCategory(event) {
      event.preventDefault();
      const name = categoryNameInput.value.trim();
      const color = categoryColorInput.value;

      if (!name) {
        showMessage("分类名称不能为空", "error");
        return;
      }

      try {
        const response = await fetch(API_CATEGORIES, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, color }),
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.detail || "创建分类失败");
        }

        showMessage("分类创建成功 🎉", "success");
        categoryNameInput.value = "";
        await fetchCategories();
      } catch (err) {
        showMessage(err.message, "error");
      }
    }

    // 删除分类
    async function deleteCategory(id) {
      if (!confirm("确定删除该分类吗？关联此分类的任务将变为未分类状态。")) return;
      try {
        const response = await fetch(`${API_CATEGORIES}/${id}`, { method: "DELETE" });
        if (!response.ok) throw new Error("删除分类失败");
        showMessage("分类已删除", "success");
        if (selectedCategoryId === id) selectedCategoryId = null;
        await fetchCategories();
        await fetchTasks();
      } catch (err) {
        showMessage(err.message, "error");
      }
    }

    // ====================================================================
    // 2. 任务模块交互 (Tasks CRUD)
    // ====================================================================

    // 获取任务列表（支持分类过滤）
    async function fetchTasks() {
      try {
        let url = `${API_TASKS}?limit=100`;
        if (selectedCategoryId !== null) {
          url += `&category_id=${selectedCategoryId}`;
        }

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`加载任务失败 HTTP ${response.status}`);
        }

        const data = await response.json();
        renderTasks(data.tasks || []);
        updateStats(data.tasks || [], data.total || 0);
      } catch (error) {
        showMessage(error.message, "error");
        emptyState.textContent = "加载失败，请确认后端服务已启动（docker compose up）";
      }
    }

    // 统计更新
    function updateStats(tasks, total) {
      const completed = tasks.filter((t) => t.is_completed).length;
      let filterText = selectedCategoryId ? ` · 已筛选分类` : "";
      statsSpan.textContent = `共 ${total} 条 · 已完成 ${completed} 条${filterText}`;
    }

    // 新增任务
    async function addTask(event) {
      event.preventDefault();

      const title = taskTitleInput.value.trim();
      const description = taskDescInput.value.trim();
      const priority = taskPrioritySelect.value;
      const categoryIdVal = taskCategorySelect.value;
      const category_id = categoryIdVal ? parseInt(categoryIdVal) : null;

      if (!title) {
        showMessage("任务标题不能为空", "error");
        taskTitleInput.focus();
        return;
      }

      try {
        const payload = {
          title,
          description: description || null,
          priority,
          category_id,
        };

        const response = await fetch(API_TASKS, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || "添加任务失败");
        }

        taskTitleInput.value = "";
        taskDescInput.value = "";
        taskPrioritySelect.value = "medium";
        showMessage("任务添加成功 ✅", "success");
        await fetchTasks();
      } catch (error) {
        showMessage(error.message, "error");
      }
    }

    // 切换任务完成状态
    async function toggleTask(task, checkbox) {
      try {
        const response = await fetch(`${API_TASKS}/${task.id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ is_completed: checkbox.checked }),
        });

        if (!response.ok) throw new Error("更新状态失败");
        showMessage(checkbox.checked ? "任务已完成 👏" : "任务已恢复为待办", "success");
        await fetchTasks();
      } catch (error) {
        checkbox.checked = !checkbox.checked;
        showMessage(error.message, "error");
      }
    }

    // 删除任务
    async function deleteTask(id) {
      if (!confirm("确定删除这条任务吗？")) return;
      try {
        const response = await fetch(`${API_TASKS}/${id}`, { method: "DELETE" });
        if (!response.ok) throw new Error("删除任务失败");
        showMessage("任务已删除", "success");
        await fetchTasks();
      } catch (error) {
        showMessage(error.message, "error");
      }
    }

    // 渲染任务列表
    function renderTasks(tasks) {
      taskList.innerHTML = "";

      if (!tasks || tasks.length === 0) {
        emptyState.hidden = false;
        emptyState.textContent = selectedCategoryId 
          ? "该分类下暂无任务，快去添加一条吧 💡" 
          : "暂无任务，在上方新建一条吧 🎉";
        return;
      }

      emptyState.hidden = true;

      for (const task of tasks) {
        const item = document.createElement("div");
        item.className = "task-item" + (task.is_completed ? " completed" : "");

        // 完成复选框
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = Boolean(task.is_completed);
        checkbox.addEventListener("change", () => toggleTask(task, checkbox));

        // 任务主体
        const body = document.createElement("div");
        body.className = "task-body";

        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.title;

        const description = document.createElement("div");
        description.className = "task-description";
        description.textContent = task.description || "";

        // 元数据：分类标签 + 优先级徽章 + 时间
        const meta = document.createElement("div");
        meta.className = "task-meta";

        // 分类标签（如果有关联分类）
        if (task.category) {
          const catBadge = document.createElement("span");
          catBadge.className = "cat-badge";
          catBadge.style.backgroundColor = task.category.color || "#1890ff";
          catBadge.style.cursor = "pointer";
          catBadge.title = "点击筛选此分类";
          catBadge.textContent = `🏷️ ${task.category.name}`;
          catBadge.onclick = (e) => {
            e.stopPropagation();
            selectCategoryFilter(task.category.id);
          };
          meta.appendChild(catBadge);
        }

        // 优先级徽章
        const pBadge = document.createElement("span");
        const p = priorityInfo(task.priority);
        pBadge.className = "badge " + p.className;
        pBadge.textContent = "优先级: " + p.label;
        meta.appendChild(pBadge);

        // 创建时间
        const time = document.createElement("span");
        time.textContent = "创建于 " + formatTime(task.created_at);
        meta.appendChild(time);

        body.appendChild(title);
        if (task.description) body.appendChild(description);
        body.appendChild(meta);

        // 删除按钮
        const delBtn = document.createElement("button");
        delBtn.className = "btn-delete";
        delBtn.textContent = "删除";
        delBtn.addEventListener("click", () => deleteTask(task.id));

        item.appendChild(checkbox);
        item.appendChild(body);
        item.appendChild(delBtn);
        taskList.appendChild(item);
      }
    }

    // ====================================================================
    // 初始化与事件绑定
    // ====================================================================
    taskForm.addEventListener("submit", addTask);
    categoryForm.addEventListener("submit", addCategory);
    refreshBtn.addEventListener("click", () => {
      fetchCategories();
      fetchTasks();
    });

    document.addEventListener("DOMContentLoaded", () => {
      fetchCategories();
      fetchTasks();
    });
  </script>
</body>
</html>
